# Fly.io deploy for the browser fallback service.
#
# Fly is a good fit: it keeps one warm Chromium per machine, gives the service
# a stable address, and can stay on Fly's private network so the browser is
# never internet-facing.
#
#   fly launch --no-deploy --dockerfile container/Dockerfile   # once, to create the app
#   fly secrets set BROWSER_SERVICE_TOKEN=$(openssl rand -base64 32)
#   fly deploy --dockerfile container/Dockerfile
#
# Point the broker at it:
#   BROWSER_SERVICE_URL = https://<app>.fly.dev        (public + token)
#   BROWSER_SERVICE_URL = http://<app>.flycast         (private network, preferred)

app = "pdpj-browser"
primary_region = "gru"        # São Paulo — closest to the PDPJ gateway

[build]
  dockerfile = "Dockerfile"   # run `fly deploy` from the container/ dir, or pass --dockerfile

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  # Keep at least one machine warm: a cold start pays the Chromium launch (~seconds).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # Chromium needs real memory; 2 GB is the floor for reliable page work.
  size = "shared-cpu-2x"
  memory = "2gb"
